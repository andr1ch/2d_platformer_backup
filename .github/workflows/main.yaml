name: Unity 2D Platformer CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for secret in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Repository secret $secret is not configured."
              exit 1
            fi
          done

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.10f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.10f1-

      - name: Install GameCI CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/game-ci.tar.gz"
          tar xzf "$RUNNER_TEMP/game-ci.tar.gz" -C "$RUNNER_TEMP" ./game-ci
          chmod +x "$RUNNER_TEMP/game-ci"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.3.10f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn

  mirror_repo:
    needs: run_tests
    if: github.repository == 'andr1ch/ARPO_LAB1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== Ошибка: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/andr1ch/2d_platformer_backup.git HEAD:main
          echo "== Код успешно продублирован =="

  build_docker_image:
    needs: run_tests
    if: github.repository == 'andr1ch/ARPO_LAB1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Compressed Placeholders for Docker
        run: |
          mkdir -p Builds/WebGL/Build
          if [ -z "$(ls -A Builds/WebGL/Build)" ]; then
            echo '<h3>Unity 6 Compressed Game Cloud Layer</h3><p>Lab 3: delivery placeholder; Unity build is not connected yet.</p>' > Builds/WebGL/index.html
            printf '// Lab 3 placeholder\n' | gzip -n > Builds/WebGL/Build/game.framework.js.gz
            printf '\000asm\001\000\000\000' | gzip -n > Builds/WebGL/Build/game.wasm.gz
            printf 'Lab 3 placeholder\n' | gzip -n > Builds/WebGL/Build/game.data.gz
            echo "Создана временная структура сжатых файлов для сборщика Docker."
          fi

      - name: Test Nginx compressed responses
        run: |
          set -euo pipefail
          docker build -t platformer-compressed:ci .
          docker run -d -p 8080:80 --name lab3-nginx platformer-compressed:ci
          trap 'docker rm -f lab3-nginx' EXIT
          docker exec lab3-nginx nginx -t
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/ > /dev/null
          for entry in 'game.framework.js.gz application/javascript' 'game.wasm.gz application/wasm' 'game.data.gz application/octet-stream'; do
            read -r file mime <<< "$entry"
            curl -fsS -D headers.txt "http://localhost:8080/Build/$file" -o response.gz
            cat headers.txt
            grep -qi '^Content-Encoding: gzip' headers.txt
            grep -qi "^Content-Type: $mime" headers.txt
            gzip -t response.gz
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/Build/missing.wasm.gz)" = 404

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/andr1ch/platformer-game:latest
            ghcr.io/andr1ch/platformer-game:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/andr1ch/ARPO_LAB1
            org.opencontainers.image.revision=${{ github.sha }}
