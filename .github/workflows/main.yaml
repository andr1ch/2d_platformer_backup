name: Unity 2D Platformer CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for secret in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Repository secret $secret is not configured."
              exit 1
            fi
          done

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.10f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.10f1-

      - name: Install GameCI CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/game-ci.tar.gz"
          tar xzf "$RUNNER_TEMP/game-ci.tar.gz" -C "$RUNNER_TEMP" ./game-ci
          chmod +x "$RUNNER_TEMP/game-ci"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.3.10f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache WebGL Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ runner.os }}-6000.3.10f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**', 'Assets/**/*.cs', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-WebGL-${{ runner.os }}-6000.3.10f1-

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: 6000.3.10f1

      - name: Verify WebGL build
        run: |
          set -euo pipefail
          test -s Builds/WebGL/index.html
          test -n "$(find Builds/WebGL/Build -name '*.loader.js' -size +0c -print -quit)"
          for extension in framework.js wasm data; do
            file=$(find Builds/WebGL/Build -name "*.$extension.unityweb" -size +0c -print -quit)
            test -n "$file"
            gzip -t "$file"
          done
          du -sh Builds/WebGL

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
          if-no-files-found: error

  mirror_repo:
    needs: run_tests
    if: github.repository == 'andr1ch/ARPO_LAB1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== Ошибка: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/andr1ch/2d_platformer_backup.git HEAD:main
          echo "== Код успешно продублирован =="

  build_docker_image:
    needs: build_game
    if: github.repository == 'andr1ch/ARPO_LAB1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Test Nginx compressed responses
        run: |
          set -euo pipefail
          docker build -t platformer-compressed:ci .
          docker run -d -p 8080:80 --name lab5-nginx platformer-compressed:ci
          trap 'docker rm -f lab5-nginx' EXIT
          docker exec lab5-nginx nginx -t
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/ > /dev/null
          for extension in framework.js wasm data; do
            file=$(basename "$(find Builds/WebGL/Build -name "*.$extension.unityweb" -print -quit)")
            case "$extension" in
              framework.js) mime=application/javascript ;;
              wasm) mime=application/wasm ;;
              data) mime=application/octet-stream ;;
            esac
            curl -fsS -D headers.txt "http://localhost:8080/Build/$file" -o response.gz
            cat headers.txt
            grep -qi '^Content-Encoding: gzip' headers.txt
            grep -qi "^Content-Type: $mime" headers.txt
            gzip -t response.gz
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/Build/missing.wasm.unityweb)" = 404

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/andr1ch/platformer-game:latest
            ghcr.io/andr1ch/platformer-game:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/andr1ch/ARPO_LAB1
            org.opencontainers.image.revision=${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    if: github.repository == 'andr1ch/ARPO_LAB1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages
